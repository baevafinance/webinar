<style>
  .reg-card {
    max-width: 460px;
    margin: 20px auto;
    padding: 32px 28px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 12px 36px rgba(37, 6, 44, 0.12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #25062C;
    box-sizing: border-box;
  }
  .reg-card * {
    box-sizing: border-box;
  }
  .reg-card__title {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
    color: #25062C;
  }
  .reg-card__subtitle {
    margin: 0 0 24px;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
    color: rgba(37, 6, 44, 0.7);
  }
  .reg-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .reg-form__group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .reg-form__label {
    font-size: 13px;
    font-weight: 600;
    color: #25062C;
  }
  .reg-form__optional {
    font-size: 12px;
    font-weight: 400;
    color: rgba(37, 6, 44, 0.55);
    margin-left: 4px;
  }
  .reg-form__req {
    color: #B3261E;
  }
  .reg-form__input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid rgba(37, 6, 44, 0.25);
    border-radius: 8px;
    background: #fff;
    color: #25062C;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .reg-form__input::placeholder {
    color: rgba(37, 6, 44, 0.45);
  }
  .reg-form__input:focus {
    outline: none;
    border-color: #390303;
    box-shadow: 0 0 0 3px rgba(57, 3, 3, 0.12);
  }
  .reg-form__hint {
    margin: 2px 0 0;
    font-size: 12px;
    line-height: 1.45;
    color: rgba(37, 6, 44, 0.65);
  }
  .reg-form__submit {
    width: 100%;
    margin-top: 6px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: #ffffff;
    background-color: #390303;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.15s ease;
  }
  .reg-form__submit:hover {
    background-color: #25062C;
    transform: translateY(-1px);
  }
  .reg-form__submit:active {
    transform: translateY(0);
  }
  .reg-form__consent {
    margin: 4px 0 0;
    font-size: 11px;
    line-height: 1.4;
    text-align: center;
    color: rgba(37, 6, 44, 0.6);
  }
  .reg-form__message {
    margin: 4px 0 0;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
    color: #B3261E;
    word-break: break-word;
  }
  .reg-form__message:empty {
    display: none;
  }
</style>

<div class="reg-card">
  <h3 class="reg-card__title">Регистрация на вебинар</h3>
  <p class="reg-card__subtitle">Заполните форму, чтобы получить ссылку на трансляцию</p>

  <form id="reg-form" class="reg-form">
    <div class="reg-form__group">
      <label class="reg-form__label" for="reg-username">Имя <span class="reg-form__req">*</span></label>
      <input class="reg-form__input" type="text" id="reg-username" name="username" placeholder="Как к вам обращаться" required>
    </div>

    <div class="reg-form__group">
      <label class="reg-form__label" for="reg-email">Email <span class="reg-form__req">*</span></label>
      <input class="reg-form__input" type="email" id="reg-email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="reg-form__group">
      <label class="reg-form__label" for="reg-phone">Телефон <span class="reg-form__optional">(необязательно)</span></label>
      <input class="reg-form__input" type="tel" id="reg-phone" name="phone" placeholder="+7 (912) 345-67-89">
      <p class="reg-form__hint">Нужен только для уведомлений о вебинаре в Telegram.</p>
    </div>

    <button type="submit" class="reg-form__submit">Зарегистрироваться</button>
    <p class="reg-form__consent">Нажимая кнопку, вы соглашаетесь на обработку персональных данных</p>
    
    <div class="error reg-form__message"></div>
  </form>
</div>

<script type="text/javascript" src="//static.bizon365.ru/form/anyform.min.js"></script>
<script type="text/javascript">
(function() {
  $bizon_init_form({
    selectors: {
      form: '#reg-form',
      message: '.error'
    },
    form_fields: {
      email: 'input[name="email"]',
      phone: { el: 'input[name="phone"]', required: false },
      username: 'input[name="username"]'
    },
    pageId: '210636:webinar-finblag',
    closestDateOnly: true,
    redirectUrl: '',
    successMessage: 'Регистрация прошла успешно! Ссылка отправлена на почту.',
    allowFormAction: false
  });
})();
</script>
